  <script type="module">
    import { auth, db } from './firebase-init.js';
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const LOCAL_MARK = 'gs_session_ack_ts';
    onAuthStateChanged(auth, (user) => {
      if (!user) return;
      const uref = doc(db, 'users', user.uid);
      onSnapshot(uref, async (snap) => {
        const bump = snap?.data()?.sessionBumpedAt?.toMillis?.() || 0;
        const seen = parseInt(localStorage.getItem(LOCAL_MARK) || '0', 10);
        if (bump > seen) {
          localStorage.setItem(LOCAL_MARK, String(bump));
          try { await signOut(auth); } finally { location.replace('login.html'); }
        }
      });
    });
  </script>
  
  <!-- prefs bootstrap: put in <head> of every page -->
  <script>
    (function () {
      const PREFS_KEY = 'gs_prefs';
      let p = {};
      try { p = JSON.parse(localStorage.getItem(PREFS_KEY) || '{}'); } catch { }
      document.documentElement.style.setProperty('--motion-scale', p.reducedMotion ? '0' : '1');
      document.documentElement.style.setProperty('--text-size', p.largerText ? '1.1rem' : '1rem');
    })();
  </script>

  <!-- Early Theme Boot -->
  <script>
    (function () {
      try {
        const root = document.documentElement;
        const userKey = localStorage.getItem("currentUser") || "anon";
        const savedTheme =
          localStorage.getItem(userKey + ":themeClass") ||
          localStorage.getItem("themeClass") ||
          localStorage.getItem("themeClass:last") ||
          "theme-original";
        const keep = (root.className || "").split(/\s+/).filter(Boolean).filter(c => !c.startsWith("theme-"));
        root.className = [...keep, savedTheme].join(" ");
        const meta = document.querySelector('meta[name="theme-color"]') || (() => { const m = document.createElement('meta'); m.name = 'theme-color'; document.head.appendChild(m); return m; })();
        const cs = getComputedStyle(root);
        meta.content = (cs.getPropertyValue('--accent-color') || cs.getPropertyValue('--accent') || '#6a5acd').trim() || '#6a5acd';
      } catch { }
    })();
  </script>

  <!-- Service worker -->
  <script src="sw-register.js"></script>

  <!-- BFCache reveal -->
  <script>
    (function () {
      const html = document.documentElement;
      const reveal = () => { html.setAttribute("data-ready", "1"); html.style.visibility = "visible"; }
      addEventListener("pageshow", e => { if (e.persisted) reveal() });
      addEventListener("pagehide", () => { html.removeAttribute("data-ready") });
      setTimeout(() => { if (html.getAttribute("data-ready") !== "1") reveal(); }, 1500);
    })();
  </script>

<body class="gs-has-nav">

  <!-- FULL WIDTH TOPBAR -->
  <header class="topbar">
    <a class="btn-home" href="./index.html" aria-label="Back to Home">
      🏠 <span>Home</span>
    </a>
    <div class="pill">Badges</div>
  </header>

  <!-- PAGE CONTENT (padded area) -->
  <div class="page-pad">
    <h1>🏅 My Badges</h1>
    <div id="badgesGrid" class="badges-grid"></div>
  </div>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      doc,
      getDoc,
      setDoc,
      updateDoc,
      arrayUnion,
      onSnapshot,
      collection
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // ---- catalog: ALL badges visible on badge wall ----
    const CATALOG = [
      { id: "login", label: "First Login", emoji: "🔑", hue: 200 },
      { id: "feelgood1", label: "1 Feel-Good Idea", emoji: "💡", hue: 50 },
      { id: "journal5", label: "5 Journal Entries", emoji: "📝", hue: 300 },
      { id: "letter1", label: "Letter to Future Me", emoji: "💌", hue: 340 },
      { id: "verses5", label: "5 Verses", emoji: "📖", hue: 85 },
      { id: "distraction5", label: "5 Distractions", emoji: "🎮", hue: 180 },
      { id: "calm5", label: "5 Calm Sessions", emoji: "🫧", hue: 260 },

      // Login streak badges
      { id: "streak3", label: "3 Day Streak", emoji: "🔥", hue: 10 },
      { id: "streak7", label: "7 Day Streak", emoji: "🌟", hue: 45 },
      { id: "streak30", label: "30 Day Streak", emoji: "🏆", hue: 50 },
      { id: "streak90", label: "90 Day Streak", emoji: "💎", hue: 190 },
      { id: "streak180", label: "6 Month Streak", emoji: "👑", hue: 270 },
      { id: "streak270", label: "9 Month Streak", emoji: "🌙", hue: 230 },
      { id: "streak365", label: "1 Year Streak", emoji: "🎉", hue: 320 }
    ];

    const grid = document.getElementById("badgesGrid");

    function revealPage() {
      document.documentElement.setAttribute("data-ready", "1");
      document.documentElement.style.visibility = "visible";
    }

    function renderCatalog() {
      if (!grid) return;

      grid.innerHTML = CATALOG.map(b => `
          <div class="badge locked" data-badge="${b.id}">
            <div class="icon" style="--h:${b.hue}">${b.emoji}</div>
            <div class="label">${b.label}</div>
          </div>
        `).join("");
    }

    function updateUnlocked(ids) {
      const earned = new Set(Array.from(ids || []));

      grid.querySelectorAll(".badge").forEach(el => {
        const badgeId = el.dataset.badge;
        const isUnlocked = earned.has(badgeId);
        el.classList.toggle("locked", !isUnlocked);
        el.setAttribute("aria-label", isUnlocked ? `${badgeId} unlocked` : `${badgeId} locked`);
      });
    }

    async function ensureUserBadgeDoc(uid) {
      if (!uid) return;

      const userRef = doc(db, "users", uid);
      try {
        const snap = await getDoc(userRef);
        if (!snap.exists()) {
          await setDoc(userRef, { badges: [] }, { merge: true });
        }
      } catch (err) {
        console.warn("[badges] could not ensure user badge doc:", err);
      }
    }

    async function award(uid, id) {
      if (!uid || !id) return;

      const userRef = doc(db, "users", uid);

      try {
        await updateDoc(userRef, {
          badges: arrayUnion(id)
        });
      } catch {
        await setDoc(userRef, {
          badges: [id]
        }, { merge: true });
      }
    }

    renderCatalog();

    window.award = (id) => {
      if (!auth.currentUser) {
        console.warn("[badges] No logged-in user.");
        return;
      }

      return award(auth.currentUser.uid, id);
    };

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        location.replace("login.html?next=" + encodeURIComponent("badges.html"));
        return;
      }

      await ensureUserBadgeDoc(user.uid);

      const userRef = doc(db, "users", user.uid);

      let rootEarned = new Set();
      let subEarned = new Set();

      function apply() {
        updateUnlocked(new Set([...rootEarned, ...subEarned]));
      }

      onSnapshot(userRef, (snap) => {
        const data = snap.data() || {};
        const arr = Array.isArray(data.badges) ? data.badges : [];

        rootEarned = new Set(arr);
        apply();
        revealPage();
      }, (err) => {
        console.error("[badges] root badge listener error:", err);
        revealPage();
      });

      onSnapshot(collection(db, "users", user.uid, "badges"), (qs) => {
        subEarned = new Set();

        qs.forEach(docSnap => {
          subEarned.add(docSnap.id);
        });

        apply();
        revealPage();
      }, (err) => {
        console.error("[badges] sub badge listener error:", err);
        revealPage();
      });
    });
  </script>
</body>
